spring.application.name=api

#DB CONNECTION
spring.datasource.url=jdbc:postgresql://localhost:5432/finledger
spring.datasource.username=aviralsingh
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#phone to server
server.port=8080
server.address=0.0.0.0

app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=12

app.razorpay.key-id=${RZP_KEY_ID}
app.razorpay.key-secret=${RZP_KEY_SECRET}
app.razorpay.webhook-secret=${RZP_WEBHOOK_SECRET}

# Swagger UI (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
